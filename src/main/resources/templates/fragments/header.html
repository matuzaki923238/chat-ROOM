<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- 共通レイアウトに入れるログアウト。ホーム・通知・トークの全画面で読み込む -->
  <header class="header" th:fragment="header">
    <span class="header__title">メッセージアプリ</span>
    <div class="header__user" th:if="${currentUser != null}">
      <!-- CurrentUserAdvice が用意した、ログイン中の利用者の名前 -->
      <span th:text="${currentUser.name} + 'さん'"></span>
      <!-- ログアウトはPOSTで送る（リンクのGETでは送らない） -->
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="header__logout">ログアウト</button>
      </form>
    </div>
  </header>
</body>
</html>
