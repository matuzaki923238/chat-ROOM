<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | メッセージアプリ</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <!-- 部品5：画面（Railsの ERB）。ログイン画面 -->
  <main class="login">
    <h1 class="login__title">メッセージアプリ</h1>
    <p class="login__lead">アカウントにログインしてください</p>

    <!-- 送信先は POST /login（SessionsController の create） -->
    <form th:action="@{/login}" method="post" class="login__form">
      <!-- ログインに失敗したときだけ、エラー文を表示する -->
      <p class="login__error" th:if="${alert}" th:text="${alert}"></p>

      <div class="field">
        <label for="email">メールアドレス</label>
        <!-- name="email" が、コントローラの @RequestParam String email に届く -->
        <input id="email" type="email" name="email" th:value="${email}"
               autocomplete="email" placeholder="example@mail.com" required>
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <!-- name="password" が、@RequestParam String password に届く -->
        <input id="password" type="password" name="password"
               autocomplete="current-password" required>
      </div>

      <button type="submit" class="button">ログイン</button>
    </form>
  </main>
</body>
</html>
