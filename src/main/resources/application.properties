spring.application.name=message-app

# データベース：H2のファイルモード。data/app.mv.db に保存され、再起動してもデータが残る
spring.datasource.url=jdbc:h2:file:./data/app
# H2コンソールに接続するときのユーザー名（パスワードは空欄）。開発用のデータベースなので固定でよい
spring.datasource.username=sa
# 起動時に、Entityの形に合わせてテーブルを自動で作る（Railsの migrate に当たる）
spring.jpa.hibernate.ddl-auto=update

# データベースの中身をブラウザで見る画面（http://localhost:8080/h2-console）
# パスワードが長いハッシュで保存されていることを確かめるために使う。開発中だけの機能
spring.h2.console.enabled=true
