<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | メッセージアプリ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login">
    <h1 class="login__title">メッセージアプリ</h1>
    <p class="login__lead">アカウントにログインしてください</p>

    <!-- novalidate: ブラウザ標準のチェックを止め、login.js で日本語のエラーを出す -->
    <form id="login-form" class="login__form" novalidate>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="example@mail.com">
        <p class="field__error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <div class="field__password">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="8文字以上">
          <button type="button" id="toggle-password" class="field__toggle" aria-label="パスワードを表示">表示</button>
        </div>
        <p class="field__error" id="password-error" aria-live="polite"></p>
      </div>

      <p class="login__error" id="form-error" aria-live="polite"></p>

      <button type="submit" class="button">ログイン</button>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
